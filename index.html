<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionnaire d'oeuvres d'arts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Gestionnaire d'oeuvres d'arts</h1>

    <!-- Statistiques (mises à jour par script.js) -->
    <section class="stats">
      <div class="stat">
        <span class="stat-valeur" id="stat-total">0</span>
        <span class="stat-label">Œuvres acquises</span>
      </div>
      <div class="stat">
        <span class="stat-valeur" id="stat-artistes">0</span>
        <span class="stat-label">Artistes</span>
      </div>
      <div class="stat">
        <span class="stat-valeur" id="stat-musees">0</span>
        <span class="stat-label">Musées</span>
      </div>
      <div class="stat">
        <span class="stat-valeur" id="stat-annee-moyenne">–</span>
        <span class="stat-label">Année moyenne</span>
      </div>
      <div class="stat">
        <span class="stat-valeur" id="stat-age-moyen">–</span>
        <span class="stat-label">Âge moyen (ans)</span>
      </div>
      <div class="stat">
        <span class="stat-valeur" id="stat-plus-ancienne">–</span>
        <span class="stat-label">Plus ancienne</span>
      </div>
    </section>

    <!-- Formulaire d'ajout -->
    <form id="formulaire-oeuvre">
      <label for="champ-titre">Titre</label>
      <input type="text" id="champ-titre" required />

      <label for="champ-artiste">Artiste</label>
      <input type="text" id="champ-artiste" required />

      <label for="champ-annee">Année</label>
      <input type="number" id="champ-annee" min="1" max="2026" required />

      <label for="champ-technique">Technique</label>
      <input type="text" id="champ-technique" />

      <label for="champ-musee">Musée</label>
      <input type="text" id="champ-musee" />

      <button type="submit">Enregistrer</button>
      <p class="erreur" id="message-erreur"></p>
    </form>

    <h2>Œuvres enregistrées</h2>

    <!-- Carte modèle : script.js la copie pour chaque œuvre -->
    <section class="carte-oeuvre" id="carte-oeuvre">
      <p class="titre-oeuvre">Chargement…</p>
      <p class="artiste-annee-oeuvre"></p>
      <p class="technique-oeuvre"></p>
      <p class="musee-oeuvre"></p>
      <button type="button" class="btn-supprimer">Supprimer</button>
    </section>

    <!-- type="module" : permet d'utiliser import / export -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
